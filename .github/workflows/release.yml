name: Release native agent

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build static Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.architecture }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/didban-agent-linux-${GOARCH}" ./cmd/didban-agent
      - uses: actions/upload-artifact@v4
        with:
          name: didban-agent-linux-${{ matrix.architecture }}
          path: dist/didban-agent-linux-${{ matrix.architecture }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: didban-agent-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        run: cd dist && sha256sum didban-agent-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/didban-agent-linux-amd64
            dist/didban-agent-linux-arm64
            dist/checksums.txt
